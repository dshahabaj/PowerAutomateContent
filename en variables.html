<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Environment Variables in Power Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body {
  overflow:hidden; color:white;
  background:
    radial-gradient(circle at top left, rgba(34,197,94,.85) 0%, transparent 35%),
    radial-gradient(circle at top right, rgba(132,204,22,.85) 0%, transparent 35%),
    radial-gradient(circle at bottom, rgba(250,204,21,.7) 0%, transparent 30%),
    #031004;
  animation: bgMove 12s ease infinite alternate;
}
@keyframes bgMove { from{filter:hue-rotate(0deg);} to{filter:hue-rotate(-20deg);} }
.slider { position:relative; width:100vw; height:100vh; }
.slide { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; padding:30px; opacity:0; transform:scale(.95) translateY(25px); transition:.8s ease; pointer-events:none; }
.slide.active { opacity:1; transform:scale(1) translateY(0); pointer-events:auto; }

.slide[data-theme="green"] .card { border-color:rgba(34,197,94,.35); box-shadow:0 30px 80px rgba(34,197,94,.25), inset 0 1px 0 rgba(255,255,255,.15); }
.slide[data-theme="green"] .slide-number { color:#4ade80; }
.slide[data-theme="green"] h1 { background:linear-gradient(90deg,#22c55e,#84cc16,#facc15,#22c55e); background-size:300%; background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.slide[data-theme="green"] .badge { background:rgba(34,197,94,.12); color:#86efac; border-color:rgba(34,197,94,.3); }
.slide[data-theme="green"] .callout { background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.35); border-left-color:#22c55e; color:#bbf7d0; }

.slide[data-theme="lime"] .card { border-color:rgba(132,204,22,.35); box-shadow:0 30px 80px rgba(132,204,22,.25), inset 0 1px 0 rgba(255,255,255,.15); }
.slide[data-theme="lime"] .slide-number { color:#a3e635; }
.slide[data-theme="lime"] h1 { background:linear-gradient(90deg,#84cc16,#facc15,#22c55e,#84cc16); background-size:300%; background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.slide[data-theme="lime"] .badge { background:rgba(132,204,22,.12); color:#bef264; border-color:rgba(132,204,22,.3); }
.slide[data-theme="lime"] .callout { background:rgba(132,204,22,.12); border-color:rgba(132,204,22,.35); border-left-color:#84cc16; color:#d9f99d; }

.slide[data-theme="gold"] .card { border-color:rgba(250,204,21,.35); box-shadow:0 30px 80px rgba(250,204,21,.25), inset 0 1px 0 rgba(255,255,255,.15); }
.slide[data-theme="gold"] .slide-number { color:#facc15; }
.slide[data-theme="gold"] h1 { background:linear-gradient(90deg,#facc15,#f97316,#22c55e,#facc15); background-size:300%; background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.slide[data-theme="gold"] .badge { background:rgba(250,204,21,.12); color:#fde047; border-color:rgba(250,204,21,.3); }
.slide[data-theme="gold"] .callout { background:rgba(250,204,21,.12); border-color:rgba(250,204,21,.35); border-left-color:#facc15; color:#fef08a; }

.slide[data-theme="emerald"] .card { border-color:rgba(16,185,129,.35); box-shadow:0 30px 80px rgba(16,185,129,.25), inset 0 1px 0 rgba(255,255,255,.15); }
.slide[data-theme="emerald"] .slide-number { color:#34d399; }
.slide[data-theme="emerald"] h1 { background:linear-gradient(90deg,#10b981,#22c55e,#84cc16,#10b981); background-size:300%; background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.slide[data-theme="emerald"] .badge { background:rgba(16,185,129,.12); color:#6ee7b7; border-color:rgba(16,185,129,.3); }
.slide[data-theme="emerald"] .callout { background:rgba(16,185,129,.12); border-color:rgba(16,185,129,.35); border-left-color:#10b981; color:#a7f3d0; }

.card { width:92%; max-width:1300px; max-height:88vh; overflow-y:auto; background:rgba(255,255,255,.06); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.10); border-radius:28px; padding:40px 45px; transition:border-color .6s ease, box-shadow .6s ease; }
.card::-webkit-scrollbar { width:8px; }
.card::-webkit-scrollbar-thumb { background:#a3e635; border-radius:50px; }
.slide-number { font-size:14px; letter-spacing:3px; margin-bottom:10px; font-weight:600; transition:color .6s ease; }
h1 { font-size:clamp(1.8rem,3.2vw,2.8rem); line-height:1.15; margin-bottom:20px; background-size:300%; background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:gradientText 8s linear infinite; transition:background .6s ease; }
@keyframes gradientText { 0%{background-position:0%;} 100%{background-position:300%;} }
p { color:#d1d5db; line-height:1.75; margin-bottom:14px; font-size:clamp(1rem,1.3vw,1.2rem); }
ul { padding-left:22px; margin-top:14px; }
li { margin:10px 0; line-height:1.7; font-size:clamp(0.95rem,1.2vw,1.15rem); }
.hero-architecture { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:14px; margin-top:35px; }
.node { padding:18px 25px; border-radius:18px; font-weight:600; min-width:210px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3); font-size:clamp(0.95rem,1.1vw,1.1rem); }
.node-green { background:linear-gradient(135deg,#16a34a,#22c55e); }
.node-lime { background:linear-gradient(135deg,#65a30d,#84cc16); color:#111; }
.node-gold { background:linear-gradient(135deg,#ca8a04,#facc15); color:#111; }
.node-emerald { background:linear-gradient(135deg,#059669,#10b981); }
.connector-line { width:60px; height:4px; background:#a3e635; border-radius:50px; }
.two-col { display:grid; grid-template-columns:1fr
